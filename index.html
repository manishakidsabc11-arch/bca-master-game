<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Master Quiz</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#10152f,#30206b,#063c5c);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.app{
  width:100%;
  max-width:850px;
  background:#121832;
  border-radius:24px;
  padding:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.screen{
  display:none;
  text-align:center;
}

.screen.active{
  display:block;
}

.logo{
  font-size:60px;
  margin-bottom:10px;
}

h1{
  font-size:38px;
  margin:10px 0;
}

h2{
  font-size:28px;
}

.subtitle{
  color:#c6cbea;
  margin-bottom:25px;
}

button{
  border:0;
  border-radius:14px;
  padding:15px 20px;
  margin:7px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#30385e;
}

button:active{
  transform:scale(.97);
}

.start{
  width:90%;
  max-width:400px;
  background:linear-gradient(90deg,#7355ff,#bd48ff);
}

.subject-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.subject{
  background:#222a4d;
  border:1px solid #3b4572;
  border-radius:18px;
  padding:20px;
  cursor:pointer;
}

.subject:hover{
  background:#303961;
}

.subject-icon{
  font-size:35px;
}

.subject-name{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.quiz-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.badge{
  background:#252d52;
  padding:10px 14px;
  border-radius:10px;
}

.timer{
  color:#ffd166;
}

.question{
  background:#222a4d;
  border-radius:18px;
  padding:25px;
  font-size:21px;
  line-height:1.5;
  margin:20px 0;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option{
  width:100%;
  text-align:left;
  background:#30385e;
}

.correct{
  background:#16734d !important;
}

.wrong{
  background:#7b3743 !important;
}

.feedback{
  min-height:30px;
  font-weight:bold;
  margin:15px;
}

.next{
  width:90%;
  max-width:400px;
  background:linear-gradient(90deg,#7355ff,#bd48ff);
}

.result-score{
  font-size:60px;
  font-weight:bold;
  margin:20px;
}

.stat{
  background:#222a4d;
  padding:14px;
  border-radius:12px;
  margin:8px auto;
  max-width:400px;
}

@media(max-width:600px){

  h1{
    font-size:29px;
  }

  .subject-grid{
    grid-template-columns:1fr;
  }

  .options{
    grid-template-columns:1fr;
  }

  .quiz-header{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<section id="home" class="screen active">

<div class="logo">💻</div>

<h1>BCA MASTER QUIZ</h1>

<p class="subtitle">
Learn • Play • Test Your Computer Knowledge
</p>

<button class="start" onclick="openSubjects()">
🚀 START CHALLENGE
</button>

<p class="subtitle">
5 Subjects • 50 Questions
</p>

</section>


<!-- SUBJECTS -->

<section id="subjects" class="screen">

<h2>🎓 SELECT A SUBJECT</h2>

<p class="subtitle">
Choose any subject to start your quiz.
</p>

<div id="subjectGrid" class="subject-grid"></div>

<button onclick="showScreen('home')">
🏠 HOME
</button>

</section>


<!-- QUIZ -->

<section id="quiz" class="screen">

<div class="quiz-header">

<div class="badge" id="subjectTitle">
Subject
</div>

<div class="badge">
⭐ Score: <span id="score">0</span>
</div>

<div class="badge timer">
⏱️ <span id="timer">15</span>
</div>

</div>

<p class="subtitle" id="questionNumber">
Question 1 / 10
</p>

<div class="question" id="question">
Question
</div>

<div class="options" id="options"></div>

<div class="feedback" id="feedback"></div>

<button id="nextButton" class="next" style="display:none" onclick="nextQuestion()">
NEXT QUESTION →
</button>

</section>


<!-- RESULT -->

<section id="result" class="screen">

<div class="logo">🏆</div>

<h2>QUIZ COMPLETE!</h2>

<div class="result-score" id="finalScore">
0
</div>

<p class="subtitle">
TOTAL POINTS
</p>

<div id="resultDetails"></div>

<button class="start" onclick="openSubjects()">
🎮 PLAY AGAIN
</button>

<br>

<button onclick="showScreen('home')">
🏠 HOME
</button>

</section>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let currentSubject="";
let currentQuestion=0;
let score=0;
let correctAnswers=0;
let wrongAnswers=0;
let timerInterval=null;
let timeLeft=15;


/* =========================
   SCREEN CONTROL
========================= */

function showScreen(id){

document.querySelectorAll(".screen").forEach(function(screen){

screen.classList.remove("active");

});

document.getElementById(id).classList.add("active");

}


/* =========================
   SUBJECT SCREEN
========================= */

function openSubjects(){

clearInterval(timerInterval);

showScreen("subjects");

const grid=document.getElementById("subjectGrid");

grid.innerHTML="";

Object.keys(quizData).forEach(function(subject){

const data=quizData[subject];

const button=document.createElement("div");

button.className="subject";

button.innerHTML=
"<div class='subject-icon'>"+
data.icon+
"</div>"+
"<div class='subject-name'>"+
subject+
"</div>"+
"<p class='subtitle'>10 Questions</p>";

button.addEventListener("click",function(){

startQuiz(subject);

});

grid.appendChild(button);

});

}


/* =========================
   START QUIZ
========================= */

function startQuiz(subject){

currentSubject=subject;

currentQuestion=0;

score=0;

correctAnswers=0;

wrongAnswers=0;

showScreen("quiz");

loadQuestion();

}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

clearInterval(timerInterval);

const questionData=
quizData[currentSubject].questions[currentQuestion];

document.getElementById("subjectTitle").textContent=
currentSubject;

document.getElementById("score").textContent=
score;

document.getElementById("questionNumber").textContent=
"Question "+
(currentQuestion+1)+
" / "+
quizData[currentSubject].questions.length;

document.getElementById("question").textContent=
questionData.q;

document.getElementById("feedback").textContent="";

document.getElementById("nextButton").style.display="none";

const options=
document.getElementById("options");

options.innerHTML="";

questionData.a.forEach(function(answer,index){

const button=document.createElement("button");

button.className="option";

button.textContent=
String.fromCharCode(65+index)+
". "+
answer;

button.addEventListener("click",function(){

checkAnswer(index);

});

options.appendChild(button);

});

startTimer();

}


/* =========================
   TIMER
========================= */

function startTimer(){

timeLeft=15;

document.getElementById("timer").textContent=
timeLeft;

timerInterval=setInterval(function(){

timeLeft--;

document.getElementById("timer").textContent=
timeLeft;

if(timeLeft<=0){

clearInterval(timerInterval);

checkAnswer(-1);

}

},1000);

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(selected){

clearInterval(timerInterval);

const questionData=
quizData[currentSubject].questions[currentQuestion];

const buttons=
document.querySelectorAll(".option");

buttons.forEach(function(button){

button.disabled=true;

});

if(selected===questionData.correct){

score+=10;

correctAnswers++;

if(selected>=0){

buttons[selected].classList.add("correct");

}

document.getElementById("feedback").textContent=
"✅ Correct! +10 Points";

}else{

wrongAnswers++;

if(selected>=0){

buttons[selected].classList.add("wrong");

}

buttons[questionData.correct].classList.add("correct");

document.getElementById("feedback").textContent=
"❌ Wrong Answer";

}

document.getElementById("score").textContent=
score;

document.getElementById("nextButton").style.display=
"inline-block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

currentQuestion++;

if(
currentQuestion>=
quizData[currentSubject].questions.length
){

showResult();

}else{

loadQuestion();

}

}


/* =========================
   RESULT
========================= */

function showResult(){

clearInterval(timerInterval);

showScreen("result");

const total=
quizData[currentSubject].questions.length;

const accuracy=
Math.round(
(correctAnswers/total)*100
);

document.getElementById("finalScore").textContent=
score;

let rating="Keep Practicing 💪";

if(accuracy>=90){

rating="🏆 BCA EXPERT";

}else if(accuracy>=75){

rating="🔥 EXCELLENT";

}else if(accuracy>=60){

rating="👍 GOOD JOB";

}

document.getElementById("resultDetails").innerHTML=

"<div class='stat'>"+
"✅ Correct: "+
correctAnswers+
"</div>"+

"<div class='stat'>"+
"❌ Wrong: "+
wrongAnswers+
"</div>"+

"<div class='stat'>"+
"📊 Accuracy: "+
accuracy+
"%"+
"</div>"+

"<div class='stat'>"+
"⭐ "+
rating+
"</div>";

}

</script>

</body>
  </html>
