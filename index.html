<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Master Challenge</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#090b24,#24105c,#063451);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px
}
.game{
width:100%;
max-width:850px;
background:#121733;
border-radius:25px;
padding:25px;
box-shadow:0 20px 60px #0008
}
.screen{text-align:center}
.hidden{display:none}
.logo{font-size:55px}
h1{font-size:36px}
h2{font-size:28px}
.sub{color:#bfc5e5}
button{
border:0;
border-radius:14px;
padding:15px 20px;
margin:7px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
background:#30385f
}
.main{
background:linear-gradient(90deg,#7355ff,#b34cff);
width:90%;
max-width:400px
}
.subjects{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}
.subject{
background:#22294d;
padding:20px;
border-radius:18px;
cursor:pointer
}
.subject:hover{background:#303861}
.quizbar{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:20px
}
.badge{
background:#252c52;
padding:10px;
border-radius:10px
}
.timer{color:#ffd166}
.question{
background:#22294d;
padding:25px;
border-radius:18px;
font-size:20px;
margin:20px 0
}
.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.option{
width:100%;
text-align:left
}
.correct{background:#13704c!important}
.wrong{background:#793746!important}
.feedback{
min-height:30px;
font-weight:bold
}
.score{
font-size:55px;
font-weight:bold
}
@media(max-width:600px){
h1{font-size:28px}
.subjects,.options{grid-template-columns:1fr}
.quizbar{flex-direction:column}
}
</style>
</head>

<body>

<div class="game">

<div id="home" class="screen">
<div class="logo">💻</div>
<h1>BCA MASTER CHALLENGE</h1>
<p class="sub">Learn • Play • Test Your BCA Knowledge</p>

<button class="main" onclick="showSubjects()">
🚀 START CHALLENGE
</button>

<p class="sub">5 BCA Subjects • 50 Questions</p>
</div>


<div id="subjects" class="screen hidden">
<h2>🎓 SELECT SUBJECT</h2>
<div id="subjectList" class="subjects"></div>
<br>
<button onclick="home()">🏠 HOME</button>
</div>


<div id="quiz" class="screen hidden">

<div class="quizbar">
<div class="badge" id="subjectName"></div>
<div class="badge">⭐ <span id="score">0</span></div>
<div class="badge timer">⏱️ <span id="time">15</span></div>
</div>

<p class="sub" id="qNumber"></p>

<div class="question" id="question"></div>

<div id="options" class="options"></div>

<p id="feedback" class="feedback"></p>

<button id="next" class="main hidden" onclick="nextQuestion()">
NEXT QUESTION →
</button>

</div>


<div id="result" class="screen hidden">
<div class="logo">🏆</div>
<h2>QUIZ COMPLETE!</h2>

<div class="score" id="finalScore">0</div>
<p class="sub">POINTS</p>

<div id="stats"></div>

<button class="main" onclick="showSubjects()">
🎮 PLAY AGAIN
</button>

<button onclick="home()">🏠 HOME</button>
</div>

</div>
